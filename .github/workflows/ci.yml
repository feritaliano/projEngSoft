# CI do Carteira B3 (D40). Cada job vira verificação obrigatória da proteção da `main` assim que existir.
# Job `database` desde 26/10/2026; `backend` desde o K1 (01/11/2026); `frontend` desde o W1 (12/11/2026); `e2e` entra no R1.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Só em PR: na main, dois merges seguidos rodam completos (B7, revisão de 12/11/2026).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  database:
    name: database
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Fixada por digest, igual ao docker-compose.yml: a tag postgres:16 passou a 16.16 em 13/11/2026,
        # que grava pg_attver em attoptions e mudava o ddl.sql gerado. Atualizar os dois juntos.
        image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_USER: carteira
          POSTGRES_PASSWORD: ci-only-password # banco descartável do CI; não é segredo
          POSTGRES_DB: carteira_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carteira -d carteira_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://carteira:ci-only-password@localhost:5432/carteira_dev
      SHADOW_DATABASE_URL: postgresql://carteira:ci-only-password@localhost:5432/carteira_shadow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # psql e pg_dump sempre de dentro do contêiner de serviço (mesma versão do servidor, hotfix #22):
      # run-sql.mjs e export-ddl.mjs leem PG_CONTAINER; o runner não instala cliente PostgreSQL.
      - name: Database container id
        run: echo "PG_CONTAINER=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"

      - name: Create shadow database (prisma migrate diff)
        run: docker exec "$PG_CONTAINER" psql -U carteira -d carteira_dev -v ON_ERROR_STOP=1 -c "CREATE DATABASE carteira_shadow"

      - run: npm ci

      - name: Validate schema
        run: npm run db:validate

      - name: Apply migrations from scratch
        run: npm run db:migrate

      - name: Schema and migrations in sync
        run: npm run db:drift

      - name: Seed twice (idempotent; counts per table must match)
        run: |
          check() { docker exec -i "$PG_CONTAINER" psql -U carteira -d carteira_dev -v ON_ERROR_STOP=1 -qAt < database/tests/seed-check.sql; }
          npm run db:seed
          check > "$RUNNER_TEMP/seed-1.txt"
          npm run db:seed
          check > "$RUNNER_TEMP/seed-2.txt"
          cat "$RUNNER_TEMP/seed-1.txt"
          diff "$RUNNER_TEMP/seed-1.txt" "$RUNNER_TEMP/seed-2.txt"

      - name: Constraint tests (public, ops and D3), on the seeded database
        run: npm run db:test

      - name: PostgreSQL versions and column options (diagnostic)
        run: |
          docker exec "$PG_CONTAINER" pg_dump --version
          docker exec "$PG_CONTAINER" psql -U carteira -d carteira_dev -c "select version()"
          docker exec "$PG_CONTAINER" psql -U carteira -d carteira_dev -c "select attrelid::regclass, attname, attoptions from pg_attribute where attoptions is not null and attrelid::regclass::text like 'public.%' limit 5"

      - name: ddl.sql matches the migrated database
        run: |
          npm run db:ddl
          git diff --exit-code -- database/sql/ddl.sql

  backend:
    name: backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      # Valores descartáveis só do CI: o export do OpenAPI valida o env como a API, mas não conecta no banco.
      # A integração e o E2E usam o PostgreSQL do Testcontainers (D40), definido no global setup.
      DATABASE_URL: postgresql://carteira:ci-only-password@localhost:5432/unused
      SHADOW_DATABASE_URL: postgresql://carteira:ci-only-password@localhost:5432/unused_shadow
      CORS_ORIGIN: http://localhost:4200
      JWT_ACCESS_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root tools (Prisma CLI)
        working-directory: .
        run: npm ci

      - name: Generate Prisma Client (backend/src/generated/prisma)
        working-directory: .
        run: npm run db:generate

      - run: npm ci

      # Dependências de produção sem vulnerabilidade alta ou crítica (B7). Se falhar sem versão corrigida, registre a
      # exceção no PR em vez de tirar o passo.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (includes layer boundaries)
        run: npm run lint

      # ts-jest only transpiles (isolatedModules) and the build excludes specs: this checks the types of the tests too.
      - name: Type check (src, specs and test/)
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:cov

      - name: Integration and E2E tests (Testcontainers, PostgreSQL 16)
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: openapi.json matches the code (D52)
        run: |
          npm run openapi:generate
          git diff --exit-code -- openapi/openapi.json
          test -z "$(git status --porcelain -- openapi)" || { echo "openapi/ has untracked or changed files; run npm run openapi:generate and commit"; git status --porcelain -- openapi; exit 1; }

      # Structure and security schemes of the contract (redocly.yaml): an operation pointing to an undefined scheme
      # made the file invalid until the K3 (audit of 09/11/2026).
      - name: openapi.json lint (Redocly CLI)
        run: npm run openapi:lint
        env:
          REDOCLY_TELEMETRY: 'off'
          REDOCLY_SUPPRESS_UPDATE_NOTICE: 'true'

      # Docker (chore/K1-backend-docker): builds the image and runs the real stack (postgres, migrate, api, worker)
      # from the .env.example, as a user would with docker compose --profile app up.
      - name: Docker stack smoke test (migrate, api, worker)
        working-directory: .
        run: |
          cp .env.example .env
          docker compose --profile app up -d --build
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:3000/api/v1/health
          echo
          test "$(docker inspect -f '{{.State.ExitCode}}' carteira-b3-migrate)" = 0
          test "$(docker inspect -f '{{.State.Running}}' carteira-b3-worker)" = true
          test "$(docker inspect -f '{{.State.Running}}' carteira-b3-api)" = true

      - name: Docker stack logs (on failure)
        if: failure()
        working-directory: .
        run: docker compose --profile app logs --no-color

      - name: Stop the Docker stack
        if: always()
        working-directory: .
        run: docker compose --profile app down -v

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The client in src/app/api/ is generated, not versioned: it comes from backend/openapi/openapi.json (D52).
      - name: Generate the API client (ng-openapi-gen)
        run: npm run api:generate

      - name: Lint (angular-eslint and design tokens only)
        run: npm run lint

      - name: Specs with coverage (Vitest, at least 80% of lines)
        run: npm run test:cov

      - name: Build
        run: npm run build
